name: update-source

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'   # 每天北京时间 04:30
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node update.mjs

      - name: Commit if changed
        run: |
          git config user.name "source-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "refresh apps.json"
            git push
          fi
